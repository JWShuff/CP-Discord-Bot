repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [ --fix, --verbose, --show-fixes ]
      - id: ruff-format
        name: ruff-format (show diff)
        args: [ --diff, --check ]
      - id: ruff-format
        name: ruff-format (apply fixes)
        args: []
#     Optional: Add pyright if you want type checking
#  - repo: https://github.com/RobertCraigie/pyright-python
