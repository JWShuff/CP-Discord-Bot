[project]
name = "cp-discord-bot"
version = "0.1.0"
description = "Discord bot for the Code Platoon Alumni server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "discord.py~=2.6.4",
    "python-dotenv~=1.2.1",
]

[project.optional-dependencies]
dev = [
    "commitizen>=3.0",
    "pre-commit>=4.5.0",
    "pyright>=1.1.407",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Commitizen config
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/bot/__init__.py:__version__"
]

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# UV Config
[tool.uv]
required-version = "~=0.9.14"
