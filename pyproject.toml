[project]
name = "cp-discord-bot"
version = "0.1.0"
description = "Discord bot for the Code Platoon Alumni server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "discord.py~=2.6.4",
    "python-dotenv~=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "commitizen>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

# Ruff config (for later)
[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Pytest config (for later)
[tool.pytest.ini_options]
testpaths = ["tests"]

# Commitizen config
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "src/bot/__init__.py:__version__"
]
